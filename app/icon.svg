<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Grid subtle overlay line -->
  <path d="M12 48 H52" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" />

  <!-- Analytics Bars -->
  <!-- Bar 1 -->
  <rect x="15" y="32" width="8" height="16" rx="2" fill="url(#barGrad)" filter="url(#glow)" />
  <!-- Bar 2 -->
  <rect x="28" y="22" width="8" height="26" rx="2" fill="url(#barGrad)" filter="url(#glow)" />
  <!-- Bar 3 -->
  <rect x="41" y="14" width="8" height="34" rx="2" fill="#FBBF24" filter="url(#glow)" />

  <!-- Trend / Distribution Link Node & Line -->
  <path d="M19 28 L32 18 L45 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="19" cy="28" r="2.5" fill="#FFFFFF" />
  <circle cx="32" cy="18" r="2.5" fill="#FFFFFF" />
  <circle cx="45" cy="10" r="3" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" />
</svg>
